name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Tests/CowColonySim.Tests.csproj

      - name: Build (Sim + Tests)
        run: dotnet build Tests/CowColonySim.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Tests/CowColonySim.Tests.csproj -c Release --no-build --nologo
