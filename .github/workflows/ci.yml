name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Sim + Tests
        run: dotnet restore Tests/CowColonySim.Tests.csproj

      - name: Build Sim + Tests
        run: dotnet build Tests/CowColonySim.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Tests/CowColonySim.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
